[package]
name = "flaresim-ec-host"
description = "Runs the FlareSim EffectCraft plug-in the way EffectCraft does (wasmi, same fuel and memory limits)"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
wasmi = { version = "2", default-features = false, features = ["std", "validate", "deterministic", "portable-dispatch"] }
serde_json = "1"
png = "0.17"

[profile.release]
debug = false
